services:
  relay:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-alpine}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    image: spcod-relay:local
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      NODE_ENV: production
      PORT: 8787
      STATIC_DIR: /app/public
      RELAY_ACCESS_KEY: ${RELAY_ACCESS_KEY:-}
      RELAY_ALLOW_ANONYMOUS: ${RELAY_ALLOW_ANONYMOUS:-false}
      ALLOW_LEGACY_WS: ${ALLOW_LEGACY_WS:-true}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      QUEUE_MAX: ${QUEUE_MAX:-1000}
      QUEUE_TTL_HOURS: ${QUEUE_TTL_HOURS:-72}
      MAX_CHANNELS: ${MAX_CHANNELS:-4096}
      MAX_DEVICES_PER_CHANNEL: ${MAX_DEVICES_PER_CHANNEL:-16}
      QUEUE_BYTES_MAX_MB: ${QUEUE_BYTES_MAX_MB:-64}
      HEARTBEAT_MS: ${HEARTBEAT_MS:-30000}
      MAX_BUFFERED_BYTES: ${MAX_BUFFERED_BYTES:-1048576}
      TICKET_RATE_PER_MIN: ${TICKET_RATE_PER_MIN:-60}
      TRUST_PROXY: ${TRUST_PROXY:-false}
    ports:
      - "${RELAY_BIND:-0.0.0.0}:${RELAY_PORT:-8787}:8787"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8787/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  caddy:
    image: caddy:2-alpine
    profiles: ["tls"]
    restart: unless-stopped
    depends_on:
      relay:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN:-}
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
      - "${CADDY_HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
